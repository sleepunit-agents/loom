version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    # Upgrade the embedding runtime only alongside an explicit store compatibility decision.
    # The golden passage and query vectors come from fastembed 2.1.0.
    ignore:
      - dependency-name: onnxruntime-node
      - dependency-name: onnxruntime-common

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
