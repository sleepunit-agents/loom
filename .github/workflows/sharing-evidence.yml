name: Project sharing evidence
on:
  pull_request:
    paths:
      - 'web/src/pieces/sharing/**'
      - 'src/pieces/sharing/**'
      - 'src/fixture.ts'
      - 'src/ui/sharing-app.integration.test.ts'
      - '.github/workflows/sharing-evidence.yml'
permissions:
  contents: read
concurrency:
  group: sharing-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install and build
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          nice -n 19 npm run build
          npx playwright-core install --with-deps chromium
      - name: Verify sharing and capture both looks at three sizes
        run: |
          export LOOM_TEST_CHROME="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          export LOOM_TEST_SHOTS="$PWD/artifacts/sharing-app"
          nice -n 19 npx vitest run src/ui/sharing-app.integration.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sharing-app-${{ github.event.pull_request.head.sha }}
          path: artifacts/sharing-app/
          if-no-files-found: error
