name: CodeQL (nightly)
# Code scanning runs on pull requests to main, once a night and on request, not on work headed to next: on 2026-11-14 its
# three Analyze jobs were the largest single user of CI runners while twenty pull requests waited.
# A finding shows up the next morning under Security > Code scanning.
on:
  # Anything headed to main is scanned before it lands: that is the release gate.
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
