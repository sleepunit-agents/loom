name: Tasks app evidence
on:
  pull_request:
    paths:
      - 'src/shared-*.ts'
      - 'src/apps/tasks*.ts'
      - 'web/src/pieces/tasks/**'
      - 'src/next.ts'
      - 'src/foundation.ts'
      - 'src/next-data.ts'
      - 'src/core/data/**'
      - 'web/src/data/**'
      - 'src/ui/tasks-app.integration.test.ts'
      - '.github/workflows/tasks-app-evidence.yml'
permissions:
  contents: read
concurrency:
  group: tasks-app-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install and build
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          nice -n 19 npm run build
          npx playwright-core install --with-deps chromium
      - name: Prove the shared Tasks forms
        run: |
          export LOOM_TEST_CHROME="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          export LOOM_TEST_SHOTS="$PWD/artifacts/tasks-app"
          nice -n 19 npx vitest run src/ui/tasks-app.integration.test.ts --maxWorkers=1
          test "$(find artifacts/tasks-app -name '*.png' | wc -l)" -eq 6
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tasks-app-${{ github.event.pull_request.head.sha }}
          path: artifacts/tasks-app/
          if-no-files-found: error
