name: CI

on:
  # main is what is released and deployed. next is where the next version is built: pull requests to it
  # merge themselves when "CI results" passes.
  push:
    branches: [main, next, 'hat-v*']
  pull_request:
    branches: [main, next, 'hat-v*']
  # The merge queue (t-1935) tests each group before it lands on main.
  merge_group:

# Superseded PR heads must not occupy runners needed by their replacement.
# Runs on main share one group. A run that has started always finishes, so main
# gets a build to deploy even while merges keep arriving; a newer merge replaces
# only a run still waiting behind it (GitHub keeps one pending run per group).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR-only: it reads the PR's head and base. In the merge queue it is
  # skipped (a skip counts as passing), since the PR was checked already.
  signoff:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # From the base branch's current tip, not base.sha: a re-run or a
      # stale event would otherwise count main's own commits as the PR's.
      - name: Every commit in the PR is signed off
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-signoff.sh --range "origin/$BASE_REF" "$HEAD_SHA"

  test:
    name: build + test
    # Both pools at once: shard 1 goes to our own runners and shards 2, 3 and 4 stay on GitHub's (six runners of ours against
    # GitHub's twenty slots: one shard each way keeps the two queues about even), so a
    # pull request never waits on one queue alone. (A job's runs-on is fixed when it is created; there is
    # no "whichever is free".) "CI results" has no shard and takes ours.
    # A pull request to next is one short job and goes to GitHub's pool whole (base_ref is empty on a push).
    # Fork safety (the one runs-on that may name self-hosted; scripts/ci-runners.test.ts holds it to
    # exactly this). Our own runners take only trusted runs: a push or a merge-queue group, which only
    # people with write access can start, or a pull request from a branch in this repository that a person
    # opened (not Dependabot's package bumps). Everything else gets ubuntu-latest, and so does everything
    # while the repository variable LOOM_SELF_HOSTED_RUNNERS isn't 'on' (the switch, and the way back to
    # GitHub's runners when ours are down). A fork can edit this file in its own pull request, and its run
    # is still this repository's, so neither this nor the runner group is the lock: the runners' own
    # job-started hook (scripts/ci-runner-hook.sh) refuses a fork's code, behind the approval every outside
    # contributor's run needs.
    runs-on: ${{ vars.LOOM_SELF_HOSTED_RUNNERS == 'on' && github.base_ref != 'next' && matrix.shard != 2 && matrix.shard != 3 && matrix.shard != 4 && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","loom"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and main test the Node that runs loom (24); a merge-queue group, if the queue is
        # ever turned back on, also tests 22. Only
        # "CI results" is a required check, so the queue doesn't wait on a matrix name a PR never ran.
        node-version: ${{ github.event_name == 'merge_group' && fromJSON('["22.x", "24.x"]') || fromJSON('["24.x"]') }}
        # A pull request to next runs the whole-program build (type check) and only the tests that the
        # changed files reach (vitest --changed), still cut into four shards: a leaf change finishes each
        # shard in about a minute, and a change to a shared file, which reaches half the suite, does not
        # run that half on one machine (measured 2026-11-14: 11 to 25 minutes unsharded). The full suite
        # runs on every push to next and on anything headed to main: that is where a cross-break shows.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, the base it is tested against.
          fetch-depth: 2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Supported by the pinned installer directly, independent of npm's
        # deprecated forwarding of custom .npmrc settings. Embeddings use CPU.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      # The household bundle (src/bundle.ts) encrypts with age; its tests run the real thing.
      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          age_tmp=$(mktemp -d)
          trap 'rm -rf "$age_tmp"' EXIT
          if curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            --output "$age_tmp/age.tar.gz"; then
            # Fail closed on a checksum mismatch; apt is only a download fallback.
            echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $age_tmp/age.tar.gz" | sha256sum --check
            tar -xzf "$age_tmp/age.tar.gz" -C "$age_tmp"
            mkdir -p "$HOME/.local/bin"
            install -m 0755 "$age_tmp/age/age" "$age_tmp/age/age-keygen" "$HOME/.local/bin/"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          else
            echo "::warning::age release download failed; falling back to apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          age --version
          age-keygen --version

      # The browser suites (src/ui/*.integration.test.ts) skip themselves when no Chrome is found, so a
      # runner without one would pass them silently. The list is theirs.
      - name: Chrome for the browser suites
        run: |
          for c in "$LOOM_TEST_CHROME" /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            [ -n "$c" ] && [ -x "$c" ] && { echo "Chrome: $c"; exit 0; }
          done
          echo "::error::No Chrome on runner $RUNNER_NAME: the browser suites would skip"; exit 1

      - name: Build
        run: npm run build

      # The embedding runtime is vendored, so nothing upstream will catch a
      # regression in it. embedding-runtime.parity.test.ts runs the real ONNX
      # model against golden vectors; this caches the ~90 MB download so that
      # costs one fetch rather than one per run.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/loom/fastembed
          key: loom-embedding-model-fast-bge-small-en-v1.5-v1

      - name: Test
        env:
          LOOM_CI_SHARD: ${{ matrix.shard }}/4
          AFFECTED_ONLY: ${{ github.event_name == 'pull_request' && github.base_ref == 'next' }}
        run: |
          reporters=(--reporter=default --reporter=blob --reporter=json --reporter=./scripts/flaky-reporter.ts --outputFile.json=artifacts/vitest.json --outputFile.blob=artifacts/shard.blob.json)
          if [ "$AFFECTED_ONLY" = true ]; then
            echo "Affected tests only, against $(git rev-parse --short HEAD^1):"
            git diff --name-only HEAD^1 HEAD | sed 's/^/  /' | head -60 || true
            npm test -- --changed HEAD^1 --shard=${{ matrix.shard }}/4 --passWithNoTests "${reporters[@]}"
            # Guards that read the file tree instead of importing it are invisible to --changed: on
            # 2026-11-14 seven unwired web modules merged past src/ui/web-reach.test.ts within the hour.
            # They are few and quick, so one shard always runs them.
            if [ "${{ matrix.shard }}" = 1 ]; then
              mapfile -t guards < <(git ls-files 'src/**/*.test.ts' 'scripts/*.test.ts' 'web/src/**/*.test.ts' 'web/src/**/*.test.tsx' | grep -i -E 'reach|seam|architect|purity|no-side-effects|boundar|scripts/ci-')
              echo "Tree guards: ${guards[*]}"
              [ "${#guards[@]}" = 0 ] || npx vitest run "${guards[@]}" --passWithNoTests
            fi
          else
            npm test -- --shard=${{ matrix.shard }}/4 "${reporters[@]}"
          fi

      - name: Keep shard reports and retry ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  # The deploy build is made on GitHub's ubuntu-latest whatever runner the tests had, so the native
  # modules loom's machine runs are built where they always were.
  package:
    name: deploy build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Build
        run: npm run build

      # Exercise runtime packaging on PRs and in the queue too. Deploy accepts
      # only a successful main-push run with the exact merged commit.
      - name: Package deploy build
        run: |
          printf '%s\n' "$GITHUB_SHA" > deploy-commit
          printf 'loom-daemon-v2\n' > deploy-protocol
          # Install production dependencies in CI, including native modules.
          # No npm build/install runs on loom's machine.
          mkdir deploy-runtime
          cp package.json package-lock.json deploy-runtime/
          (cd deploy-runtime && ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci --omit=dev --ignore-scripts && ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm rebuild better-sqlite3 onnxruntime-node)
          mv deploy-runtime/node_modules node_modules-runtime
          mv node_modules node_modules-dev
          mv node_modules-runtime node_modules
          tar -czf loom-build.tar.gz dist assets package.json package-lock.json deploy-commit deploy-protocol node_modules
          mv node_modules deploy-runtime/node_modules
          mv node_modules-dev node_modules
      - name: Keep deploy build
        uses: actions/upload-artifact@v7
        with:
          name: loom-build-${{ github.sha }}
          overwrite: true
          path: loom-build.tar.gz
          retention-days: 14
          if-no-files-found: error

  # Same required result as the shards: a separate failing workflow cannot be ignored.
  walkthrough:
    name: built program walkthrough
    # The result gate independently rejects a skipped required job; both scopes are guarded.
    if: github.base_ref == 'next' || github.ref == 'refs/heads/next'
    uses: ./.github/workflows/rebuild-walkthrough.yml

  results:
    name: CI results
    if: always()
    needs: [test, package, walkthrough]
    # Fork safety (the one runs-on that may name self-hosted; scripts/ci-runners.test.ts holds it to
    # exactly this). Our own runners take only trusted runs: a push or a merge-queue group, which only
    # people with write access can start, or a pull request from a branch in this repository that a person
    # opened (not Dependabot's package bumps). Everything else gets ubuntu-latest, and so does everything
    # while the repository variable LOOM_SELF_HOSTED_RUNNERS isn't 'on' (the switch, and the way back to
    # GitHub's runners when ours are down). A fork can edit this file in its own pull request, and its run
    # is still this repository's, so neither this nor the runner group is the lock: the runners' own
    # job-started hook (scripts/ci-runner-hook.sh) refuses a fork's code, behind the approval every outside
    # contributor's run needs.
    runs-on: ${{ vars.LOOM_SELF_HOSTED_RUNNERS == 'on' && github.base_ref != 'next' && matrix.shard != 2 && matrix.shard != 3 && matrix.shard != 4 && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","loom"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install report reader
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-node-*
          path: reports
      - name: Merge reports per Node version
        run: bash scripts/merge-ci-reports.sh
      - name: Collect every retried test
        if: always()
        run: |
          mkdir -p merged
          find reports -name flaky.jsonl -exec cat {} + > merged/flaky.jsonl
          echo '### Retried tests (burn down in t-2012)' >> "$GITHUB_STEP_SUMMARY"
          if [ -s merged/flaky.jsonl ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat merged/flaky.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No retried tests recorded. Check shard completion before treating this as clean.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-merged-${{ github.run_attempt }}
          path: merged/
          retention-days: 14
      - name: Require every shard, deploy build and next walkthrough to pass
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          WALKTHROUGH_RESULT: ${{ needs.walkthrough.result }}
          REBUILD_REQUIRED: ${{ github.base_ref == 'next' || github.ref == 'refs/heads/next' }}
        run: node scripts/ci-results.ts
