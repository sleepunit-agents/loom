name: CI

on:
  push:
    branches: [main, 'hat-v*']
  pull_request:
    branches: [main, 'hat-v*']
  # The merge queue (t-1935) tests each group before it lands on main.
  merge_group:

# Superseded PR heads must not occupy runners needed by their replacement.
# Main and merge-queue runs retain distinct groups and are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR-only: it reads the PR's head and base. In the merge queue it is
  # skipped (a skip counts as passing), since the PR was checked already.
  signoff:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # From the base branch's current tip, not base.sha: a re-run or a
      # stale event would otherwise count main's own commits as the PR's.
      - name: Every commit in the PR is signed off
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-signoff.sh --range "origin/$BASE_REF" "$HEAD_SHA"

  test:
    name: build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'merge_group' && fromJSON('["24.x"]') || fromJSON('["22.x", "24.x"]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Supported by the pinned installer directly, independent of npm's
        # deprecated forwarding of custom .npmrc settings. Embeddings use CPU.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      # The household bundle (src/bundle.ts) encrypts with age; its tests run the real thing.
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Build
        run: npm run build

      # Exercise runtime packaging on PRs and in the queue too. Deploy accepts
      # only a successful main-push run with the exact merged commit.
      - name: Package deploy build
        if: matrix.node-version == '24.x' && matrix.shard == 1
        run: |
          printf '%s\n' "$GITHUB_SHA" > deploy-commit
          printf 'loom-worker-v1\n' > deploy-protocol
          # Install production dependencies in CI, including native modules.
          # No npm build/install runs on loom's machine.
          mkdir deploy-runtime
          cp package.json package-lock.json deploy-runtime/
          (cd deploy-runtime && ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci --omit=dev --ignore-scripts && ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm rebuild better-sqlite3 onnxruntime-node)
          mv deploy-runtime/node_modules node_modules-runtime
          mv node_modules node_modules-dev
          mv node_modules-runtime node_modules
          tar -czf loom-build.tar.gz dist assets package.json package-lock.json deploy-commit deploy-protocol node_modules
          mv node_modules deploy-runtime/node_modules
          mv node_modules-dev node_modules
      - name: Keep deploy build
        if: matrix.node-version == '24.x' && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: loom-build-${{ github.sha }}
          overwrite: true
          path: loom-build.tar.gz
          retention-days: 14
          if-no-files-found: error

      # The embedding runtime is vendored, so nothing upstream will catch a
      # regression in it. embedding-runtime.parity.test.ts runs the real ONNX
      # model against golden vectors; this caches the ~90 MB download so that
      # costs one fetch rather than one per run.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/loom/fastembed
          key: loom-embedding-model-fast-bge-small-en-v1.5-v1

      - name: Test
        env:
          LOOM_CI_SHARD: ${{ matrix.shard }}/4
        run: npm test -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob --reporter=json --reporter=./scripts/flaky-reporter.ts --outputFile.json=artifacts/vitest.json --outputFile.blob=artifacts/shard.blob.json

      - name: Keep shard reports and retry ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  results:
    name: CI results
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install report reader
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-node-*
          path: reports
      - name: Merge reports per Node version
        run: bash scripts/merge-ci-reports.sh
      - name: Collect every retried test
        if: always()
        run: |
          mkdir -p merged
          find reports -name flaky.jsonl -exec cat {} + > merged/flaky.jsonl
          echo '### Retried tests (burn down in t-2012)' >> "$GITHUB_STEP_SUMMARY"
          if [ -s merged/flaky.jsonl ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat merged/flaky.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No retried tests recorded. Check shard completion before treating this as clean.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-merged-${{ github.run_attempt }}
          path: merged/
          retention-days: 14
      - name: Require every shard to pass
        if: always()
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
