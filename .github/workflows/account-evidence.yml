name: Personal account evidence
on:
  pull_request:
    paths:
      - 'web/src/pieces/account/**'
      - 'src/core/signin/**'
      - 'web/src/shell/**'
      - 'web/src/signin/**'
      - 'src/shared-serve.ts'
      - 'src/shared-root.ts'
      - 'src/shared-credentials.ts'
      - 'src/ui/account-next.integration.test.ts'
      - '.github/workflows/account-evidence.yml'
permissions:
  contents: read
concurrency:
  group: account-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install and build
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          nice -n 19 npm run build
          npx playwright-core install --with-deps chromium
      - name: Verify account and capture the actual shared listener
        run: |
          export LOOM_TEST_CHROME="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          export LOOM_DESK_EVIDENCE=1
          nice -n 19 npx vitest run src/ui/account-next.integration.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: account-app-${{ github.event.pull_request.head.sha }}
          path: artifacts/household-account/
          if-no-files-found: error
