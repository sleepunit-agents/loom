name: Rebuild walkthrough
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# The caller owns cancellation; the reusable job takes no second concurrency lock.
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Check that page evidence survives regeneration
        run: |
          nice -n 19 python3 scripts/rebuild-checklists.test.py
          nice -n 19 python3 scripts/rebuild-checklists.py --check
      - name: Build the actual program
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          nice -n 19 npm ci --no-audit --no-fund
          nice -n 19 npm run build
          npx playwright-core install --with-deps chromium
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/loom/fastembed
          key: loom-embedding-model-fast-bge-small-en-v1.5-v1
      - name: Sign in and visit every launcher app
        env:
          TZ: America/Chicago
          LOOM_BROWSER_TESTS: 'on'
        run: |
          set -euo pipefail
          export LOOM_TEST_CHROME="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          test -x "$LOOM_TEST_CHROME"
          export LOOM_TEST_SHOTS="$RUNNER_TEMP/rebuild-walkthrough-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$LOOM_TEST_SHOTS/report.json"
          nice -n 19 npx vitest run src/ui/rebuild-walkthrough.integration.test.ts --maxWorkers=1
          test -s "$LOOM_TEST_SHOTS/report.json"
          export LOOM_WALKTHROUGH_EVIDENCE_RUN="$(node --input-type=module -e 'import {readFileSync} from "node:fs";process.stdout.write(JSON.parse(readFileSync(process.argv[1],"utf8")).evidenceRun)' "$LOOM_TEST_SHOTS/walkthrough.json")"
          test -n "$LOOM_WALKTHROUGH_EVIDENCE_RUN"
          LOOM_DESK_EVIDENCE=1 nice -n 19 npx vitest run src/ui/account-next.integration.test.ts --maxWorkers=1
          node scripts/rebuild-signin-evidence.mjs "$LOOM_TEST_SHOTS" artifacts/household-account
          LOOM_PROGRAM_EVIDENCE=1 nice -n 19 npx vitest run src/ui/programme-home.integration.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rebuild-walkthrough-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebuild-walkthrough-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Preserve required sign-in evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: required-signin-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/household-account/
          if-no-files-found: warn
      - name: Show per-page results in this run
        if: always()
        run: node scripts/rebuild-ci-summary.mjs "${{ runner.temp }}/rebuild-walkthrough-${{ github.run_id }}-${{ github.run_attempt }}/report.json" >> "$GITHUB_STEP_SUMMARY"
