name: How-it-works site
# Publishes docs/how-it-works/site (the approved description of the finished
# product) to GitHub Pages. The pages are static and committed; nothing is built.
on:
  push:
    branches: [main]
    paths:
      - 'docs/how-it-works/site/**'
      - '.github/workflows/how-it-works-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: how-it-works-site
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/how-it-works/site
      - id: deploy
        uses: actions/deploy-pages@v5
